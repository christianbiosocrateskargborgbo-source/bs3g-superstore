<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BS3G V8 OLD FIX</title></head>
<body style="background:#000;color:#fff;text-align:center;padding:20px;font-family:Arial">
<h1 style="color:gold">BS3G V8 👑 OLD WALLET FIX</h1>
<div id="s" style="background:#111;border:3px solid #8247E5;padding:15px;margin:10px;color:#0f0">OLD WALLET MODE - Tap PAY directly - Skip CONNECT</div>
<button onclick="pay()" style="background:gold;color:#000;padding:25px;width:95%;font-size:20px;font-weight:900;border-radius:15px;border:3px solid #fff;margin:10px">💛 PAY 0.01 POL DIRECT (NO CONNECT NEEDED)</button><br>
<button onclick="c()" style="background:#8247E5;color:#fff;padding:15px;width:95%;border-radius:10px;margin:10px">💜 TRY CONNECT (if pay fails)</button>
<script>
async function c(){ try{ const p=window.ethereum; const a=await p.request({method:'eth_requestAccounts'}); document.getElementById('s').innerText="CONNECTED: "+a[0]; alert("Connected "+a[0]); }catch(e){alert(e.message)} }
async function pay(){
  document.getElementById('s').innerText="Trying direct pay...";
  try{
    const p=window.ethereum||window.trustwallet;
    if(!p){alert("No wallet");return;}
    const accts = await p.request({method:'eth_accounts'});
    let from = accts[0];
    if(!from){ const a2 = await p.request({method:'eth_requestAccounts'}); from=a2[0]; }
    const tx = await p.request({method:'eth_sendTransaction',params:[{from:from,to:'0x3e65FA6e7D7E14193702AB9591299dcfcC7a0E55',value:'0x2386F26FC10000'}]});
    document.getElementById('s').innerText="🎉 PAID! "+tx; alert("PAID! TX: "+tx);
  }catch(e){ document.getElementById('s').innerText="❌ "+e.message; alert("Pay error: "+e.message+" - Trying connect first then tap pay again"); }
}
</script>
</body></html>
